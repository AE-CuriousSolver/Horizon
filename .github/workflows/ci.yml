# Checks for every pull request. Uses NO secrets and never touches the real database.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Placeholders so the build can run; nothing connects to them.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  database:
    name: Migrations + RLS tests (throwaway local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - name: Start a local Supabase and apply every migration
        run: supabase db start
      - name: Run pgTAP tests (privacy, history, notes, demo seed)
        run: supabase test db
      - if: always()
        run: supabase stop --no-backup
